[project]
name = "speech-cpp-drama3-reference"
version = "0"
description = "Runs the official Fish Audio Drama 3 to dump reference tensors and speak sentences, and converts its weights to GGUF"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fish-speech @ git+https://github.com/fishaudio/fish-speech@541566932abbaebcb0a40e562a1f846738383f38",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "numpy",
  "safetensors",
  "soundfile",
  "huggingface_hub",
  "gguf",
]

[tool.uv]
package = false
constraint-dependencies = [
  # The versions fish-speech's own uv.lock pins at the commit above, so that the official code runs on the packages
  # it was released with; torch, Triton and the CUDA libraries follow the torch pinned above.
  "absl-py==2.3.1",
  "annotated-types==0.7.0",
