override-dependencies = [
  # fish-speech overrides descript-audiotools' protobuf<3.20 in its own project, which uv honours only at the root.
  "protobuf>=3.20.0,<6.0.0",
  # fish-speech lists PyAudio for its microphone, which nothing here opens; it builds from source against PortAudio.
  "pyaudio; sys_platform == 'never'",
]
